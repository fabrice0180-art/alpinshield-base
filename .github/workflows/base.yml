# Base de menaces Alpin Shield (développement par Fabrice M.) : reconstruite toutes les 6 heures, gratuitement.
name: Base
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write   # publier la release « base »
  issues: write     # fermer les tickets de contribution une fois intégrés

concurrency:
  group: base
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: État précédent des contributions
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p sortie
          gh release download base -p contributions.json -D sortie --clobber || echo "Première construction"

      - name: Contributions des installations
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: python outils/integrer.py

      - name: Construction de la base
        env: { ABUSECH_CLE: "${{ secrets.ABUSECH_CLE }}" }
        run: python outils/construire.py

      - name: Publication
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view base >/dev/null 2>&1 || gh release create base --title "Base Alpin Shield" --notes "Première publication."
          gh release upload base sortie/* --clobber
          NOTES=$(python3 - <<'PY'
          import json
          d = json.load(open("sortie/index.json"))
          print(f"Base mise à jour le {d['date']} : {d['empreintes']:,} empreintes ({d['menaces']:,} menaces, "
                f"{d['sains']:,} logiciels sains), {d['domaines']:,} sites dangereux, {d['serveurs']:,} serveurs pirates."
                .replace(",", " "))
          PY
          )
          gh release edit base --notes "$NOTES"
          echo "$NOTES" >> "$GITHUB_STEP_SUMMARY"

      # Copie de la base sur Cloudflare Pages (gratuit, sans limite de trafic) + guichet des signalements.
      # Ignoré tant que la clé Cloudflare n'est pas enregistrée dans les secrets du dépôt.
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Publication sur Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN || secrets.CLOUFLARE_API_TOKEN }}"
          CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
          CLE_CONTRIBUTION: "${{ secrets.CLE_CONTRIBUTION }}"
          GH_TOKEN: "${{ github.token }}"
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare pas encore configuré : étape ignorée."; exit 0
          fi
          # clés nettoyées (espaces, retours à la ligne, marque BOM d'un copier-coller)
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d ' \r\n\357\273\277'); export CLOUDFLARE_API_TOKEN
          CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d ' \r\n\357\273\277'); export CLOUDFLARE_ACCOUNT_ID
          CLE_CONTRIBUTION=$(printf '%s' "$CLE_CONTRIBUTION" | tr -d ' \r\n\357\273\277')
          W="npx --yes wrangler@3.114.0"
          rm -rf site && mkdir site && cp sortie/* site/
          # dernière version d'Alpin Shield (version « logiciel ») : copiée aussi sur Cloudflare
          mkdir -p site/logiciel
          gh release download logiciel -D site/logiciel 2>/dev/null || echo "Pas encore de version du logiciel publiée."
          python3 outils/logiciel_cloudflare.py site/logiciel
          $W pages project create alpinshield-base --production-branch main >/dev/null 2>&1 || true
          if [ -n "$CLE_CONTRIBUTION" ]; then
            printf '%s' "$CLE_CONTRIBUTION" | $W pages secret put GITHUB_JETON --project-name alpinshield-base
          fi
          $W pages deploy site --project-name alpinshield-base --branch main --commit-dirty=true
          echo "Copie Cloudflare : https://alpinshield-base.pages.dev/" >> "$GITHUB_STEP_SUMMARY"
